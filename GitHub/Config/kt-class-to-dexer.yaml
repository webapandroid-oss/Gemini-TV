name: Kotlin Class to DEX Compiler

on:
  workflow_call:
    inputs:
      min_sdk:
        description: 'Target minimum SDK level for dexer'
        required: false
        default: '26'
        type: string
    outputs:
      dex_artifact_name:
        description: 'Name of the uploaded DEX artifact'
        value: ${{ jobs.compile_kotlin_to_dex.outputs.dex_artifact }}
      dex_file_path:
        description: 'Relative path to generated classes.dex'
        value: ${{ jobs.compile_kotlin_to_dex.outputs.dex_path }}
  workflow_dispatch:
    inputs:
      min_sdk:
        description: 'Target minimum SDK level for dexer'
        required: false
        default: '26'

jobs:
  compile_kotlin_to_dex:
    name: Compile Kotlin to JVM Class and DEX
    runs-on: ubuntu-latest
    outputs:
      dex_artifact: classes-dex-artifact
      dex_path: output/classes.dex

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK Environment
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi
          echo "Android SDK located at: $SDK_DIR"

      - name: Compile Kotlin and Java Sources to .class Bytecode
        run: |
          echo "==> Step 1: Compiling Kotlin code into Java .class bytecode..."
          mkdir -p output/classes
          
          chmod +x ./gradlew 2>/dev/null || true
          if [ ! -f "./gradlew" ] && command -v gradle &>/dev/null; then
            gradle wrapper
          fi
          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon
            find app/build/intermediates/javac/debug -type f -name "*.class" -exec cp --parents {} output/classes/ \; 2>/dev/null || true
            find app/build/tmp/kotlin-classes/debug -type f -name "*.class" -exec cp --parents {} output/classes/ \; 2>/dev/null || true
          fi

          echo "Compiled .class files generated:"
          find output/classes -type f -name "*.class" 2>/dev/null | head -n 30 || true

      - name: Convert .class Bytecode to Android .dex with D8 / DX
        run: |
          echo "==> Step 2: Converting compiled .class files into Dalvik Executable (.dex)..."
          mkdir -p output/dex

          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:dexDebug --no-daemon 2>/dev/null || ./gradlew :app:assembleDebug --no-daemon 2>/dev/null || true
          fi

          # Capture all generated .dex files (including multidex)
          find app/build -type f -name "classes*.dex" -exec cp {} output/dex/ \; 2>/dev/null || true

          if [ ! -f "output/dex/classes.dex" ]; then
            SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
            ANDROID_JAR=$(find "$SDK_DIR/platforms" -name "android.jar" 2>/dev/null | sort -V | tail -n 1)
            echo "Running D8 directly with android.jar..."
            find output/classes app/build -type f -name "*.class" > class_list.txt
            if [ -s class_list.txt ] && [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/d8" ]; then
              "$BUILD_TOOLS_DIR/d8" --release --min-api ${{ inputs.min_sdk || '26' }} --lib "$ANDROID_JAR" --output output/dex/ $(cat class_list.txt) || true
            fi
          fi

          echo "Final DEX verification:"
          ls -lh output/dex/

      - name: Upload classes.dex Artifact for Main Orchestrator
        uses: actions/upload-artifact@v4
        with:
          name: classes-dex-artifact
          path: |
            output/dex/classes.dex
            app/build/intermediates/dex/debug/**/*.dex
          if-no-files-found: warn
          retention-days: 7
