name: APK Release Master Orchestrator

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Gemini TV Release'
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.1.03.8'

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # Action 2: Kotlin to Class to Dalvik DEX Compiler
  # --------------------------------------------------------------------------
  compile_dex:
    name: "Step 1: Kotlin Code -> .class -> classes.dex"
    uses: ./.github/workflows/kt-class-to-dexer.yaml
    secrets: inherit
    with:
      min_sdk: '26'

  # --------------------------------------------------------------------------
  # Action 3: AAPT2 Resource & Manifest Compiler
  # --------------------------------------------------------------------------
  compile_aapt:
    name: "Step 2: AAPT2 -> resources.arsc & AndroidManifest.xml"
    uses: ./.github/workflows/aapt-compiler-tool.yaml
    secrets: inherit
    with:
      target_sdk: '35'

  # --------------------------------------------------------------------------
  # Action 1: Package DEX + ARSC + Manifest into APK, Sign & Release
  # --------------------------------------------------------------------------
  package_and_release_apk:
    name: "Step 3: Pack APK, Align, Sign and Publish Release"
    runs-on: ubuntu-latest
    needs: [compile_dex, compile_aapt]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android Build Tools & SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Workspace Directories
        run: |
          mkdir -p workspace/apk_root
          mkdir -p workspace/dist

      - name: Download DEX Artifact from kt-class-to-dexer
        uses: actions/download-artifact@v4
        with:
          name: classes-dex-artifact
          path: workspace/dex_in

      - name: Download AAPT Resources Artifact from aapt-compiler-tool
        uses: actions/download-artifact@v4
        with:
          name: aapt-resources-artifact
          path: workspace/aapt_in

      - name: Assemble All Components into APK Archive
        run: |
          echo "==> Step 3.1: Gathering compiled components..."
          cd workspace/apk_root

          # 1. Unpack AAPT resources.apk if present (contains AndroidManifest.xml, resources.arsc, and res/)
          RES_APK=$(find ../aapt_in -type f -name "resources.apk" -o -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RES_APK" ] && [ -f "$RES_APK" ]; then
            echo "Unpacking compiled resources package: $RES_APK"
            unzip -q -o "$RES_APK" -d ./
          fi

          # 2. Gather DEX files from kt-class-to-dexer artifact (supporting multidex)
          DEX_FILES=$(find ../dex_in -type f -name "*.dex" 2>/dev/null)
          if [ -n "$DEX_FILES" ]; then
            for dex in $DEX_FILES; do
              cp "$dex" ./
              echo "Added $(basename "$dex") to APK root"
            done
          fi

          # 3. Locate resources.arsc and AndroidManifest.xml if not already extracted
          if [ ! -f "resources.arsc" ]; then
            ARSC_FOUND=$(find ../aapt_in -type f -name "resources.arsc" 2>/dev/null | head -n 1)
            if [ -n "$ARSC_FOUND" ]; then
              cp "$ARSC_FOUND" ./resources.arsc
              echo "Added resources.arsc from $ARSC_FOUND"
            fi
          fi

          if [ ! -f "AndroidManifest.xml" ]; then
            MANIFEST_FOUND=$(find ../aapt_in -type f -name "AndroidManifest.xml" 2>/dev/null | head -n 1)
            if [ -n "$MANIFEST_FOUND" ]; then
              cp "$MANIFEST_FOUND" ./AndroidManifest.xml
              echo "Added AndroidManifest.xml from $MANIFEST_FOUND"
            fi
          fi

          # 4. Copy Web Assets (index.html, app.js, style.css)
          mkdir -p assets
          if [ -d "../aapt_in/output/aapt_out/assets" ]; then
            cp -r ../aapt_in/output/aapt_out/assets/* assets/ 2>/dev/null || true
          elif [ -d "../aapt_in/assets" ]; then
            cp -r ../aapt_in/assets/* assets/ 2>/dev/null || true
          elif [ -d "../../app/src/main/assets" ]; then
            cp -r ../../app/src/main/assets/* assets/
          fi
          echo "Added web assets into APK assets/ folder"

          # 5. Copy Native Libraries (.so)
          mkdir -p lib
          if [ -d "../../app/src/main/jniLibs" ]; then
            cp -r ../../app/src/main/jniLibs/* lib/
            echo "Added native JNI libraries to lib/"
          fi

          # 6. Fallback: If AndroidManifest.xml or resources.arsc is missing, compile clean APK via Gradle
          if [ ! -f "AndroidManifest.xml" ] || [ ! -f "resources.arsc" ]; then
            echo "WARNING: AndroidManifest.xml or resources.arsc not found in artifacts. Assembling APK via Gradle..."
            cd ../..
            chmod +x ./gradlew 2>/dev/null || true
            if command -v gradle &>/dev/null; then
              gradle :app:assembleRelease --no-daemon 2>/dev/null || gradle :app:assembleDebug --no-daemon
            elif [ -f "./gradlew" ]; then
              ./gradlew :app:assembleRelease --no-daemon 2>/dev/null || ./gradlew :app:assembleDebug --no-daemon
            fi
            APK_GEN=$(find app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" 2>/dev/null | head -n 1)
            if [ -n "$APK_GEN" ] && [ -f "$APK_GEN" ]; then
              echo "Found Gradle APK: $APK_GEN, copying directly to unaligned.apk"
              cp "$APK_GEN" workspace/dist/unaligned.apk
            fi
            cd workspace/apk_root
          fi

          # 7. Pack into unaligned APK if not already generated by Gradle
          if [ ! -f "../dist/unaligned.apk" ] || [ ! -s "../dist/unaligned.apk" ]; then
            echo "Packing gathered files into unaligned APK..."
            zip -r -q ../dist/unaligned.apk ./*
          fi
          cd ../..

          # 8. Integrity check: ensure unaligned.apk contains AndroidManifest.xml
          if ! unzip -l workspace/dist/unaligned.apk AndroidManifest.xml &>/dev/null; then
            echo "CRITICAL: unaligned.apk missing AndroidManifest.xml! Running Gradle fallback build..."
            chmod +x ./gradlew 2>/dev/null || true
            if command -v gradle &>/dev/null; then
              gradle :app:assembleRelease --no-daemon 2>/dev/null || gradle :app:assembleDebug --no-daemon
            elif [ -f "./gradlew" ]; then
              ./gradlew :app:assembleRelease --no-daemon 2>/dev/null || ./gradlew :app:assembleDebug --no-daemon
            fi
            APK_GEN=$(find app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" 2>/dev/null | head -n 1)
            if [ -n "$APK_GEN" ] && [ -f "$APK_GEN" ]; then
              cp "$APK_GEN" workspace/dist/unaligned.apk
            fi
          fi

          ls -lh workspace/dist/

      - name: Align and Sign APK using zipalign & apksigner
        run: |
          echo "==> Step 3.2: 4-byte memory alignment with zipalign..."
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android/sdk}}"
          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN="${BUILD_TOOLS_DIR:-}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR:-}/apksigner"
          if ! command -v "$ZIPALIGN" &>/dev/null && command -v zipalign &>/dev/null; then
            ZIPALIGN="zipalign"
          fi
          if ! command -v "$APKSIGNER" &>/dev/null && command -v apksigner &>/dev/null; then
            APKSIGNER="apksigner"
          fi

          # Zipalign 4-byte page boundary (with -f to force overwrite)
          "$ZIPALIGN" -f -v -p 4 workspace/dist/unaligned.apk workspace/dist/gemini-tv-aligned.apk

          echo "==> Step 3.3: Signing APK..."
          # Check for debug.keystore or generate a secure keystore for the release
          KEYSTORE_FILE="release.keystore"
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "$KEYSTORE_FILE"
            KS_PASS="android"
            KEY_ALIAS="androiddebugkey"
            KEY_PASS="android"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias releaseKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "androidrelease" \
              -keypass "androidrelease" \
              -dname "CN=GeminiTV, OU=AndroidTV, O=GoogleGemini, L=MountainView, S=CA, C=US"
            KS_PASS="androidrelease"
            KEY_ALIAS="releaseKey"
            KEY_PASS="androidrelease"
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --min-sdk-version 26 \
            --out workspace/dist/gemini-tv-release.apk \
            workspace/dist/gemini-tv-aligned.apk

          echo "==> Step 3.4: Verifying APK signature..."
          "$APKSIGNER" verify --verbose workspace/dist/gemini-tv-release.apk

          RELEASE_NAME="1.1.03.8.google_gemini_20261027.81_main_api26.gma.armeabi-v7a.release.apk"
          cp workspace/dist/gemini-tv-release.apk "workspace/dist/$RELEASE_NAME"

          echo "Final Signed Release APKs:"
          ls -lh workspace/dist/

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tv-release-apk
          path: |
            workspace/dist/gemini-tv-release.apk
            workspace/dist/1.1.03.8.google_gemini_20261027.81_main_api26.gma.armeabi-v7a.release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name || 'v1.1.03.8' }}
          name: ${{ inputs.release_title || 'Gemini TV v1.1.03.8 Release' }}
          body: |
            ## 🚀 Gemini TV Android Release
            
            **Version Code:** 3  
            **Version Name:** `1.1.03.8.google_gemini_20261027.81_main_api26.gma.armeabi-v7a.release`
            
            ### 📦 Build Artifacts
            - **DEX Engine:** Compiled via `kt-class-to-dexer.yaml` (Kotlin -> .class -> classes.dex)
            - **Resource Package:** Compiled via `aapt-compiler-tool.yaml` (resources.arsc & AndroidManifest.xml)
            - **Assembly & Signing:** Packaged, zip-aligned, and signed via `apk-release.yaml`
            
            ### 📥 Download
            Download the signed APK below:
            - `1.1.03.8.google_gemini_20261027.81_main_api26.gma.armeabi-v7a.release.apk`
          files: |
            workspace/dist/gemini-tv-release.apk
            workspace/dist/1.1.03.8.google_gemini_20261027.81_main_api26.gma.armeabi-v7a.release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
