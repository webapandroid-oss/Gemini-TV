name: "Class to DEX MultiDex Compiler"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: class-to-dex-${{ github.ref }}
  cancel-in-progress: true

env:
  STORE_PASSWORD: "android"
  KEY_PASSWORD: "android"
  KEY_ALIAS: "upload"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Djava.awt.headless=true -XX:MaxMetaspaceSize=512m"

jobs:
  convert_classes_to_dex:
    name: Convert .class Bytecode to MultiDex .dex Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK Environment
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare Environment Secrets
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Keystore for Signing Configuration
        run: |
          ROOT_DIR="$(pwd)"
          KEYSTORE_FILE="$ROOT_DIR/my-upload-key.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=GoogleGemini, OU=AndroidTV, O=Google, L=MountainView, S=CA, C=US"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build MultiDex DEX Files via D8 Engine
        run: |
          echo "==> Running MultiDex compilation tasks..."
          ./gradlew :app:dexBuilderRelease :app:mergeDexRelease --stacktrace --no-daemon

      - name: Collect MultiDex DEX Outputs
        run: |
          DEX_OUT="output/dex"
          mkdir -p "$DEX_OUT"
          
          echo "==> Gathering generated DEX files from intermediate build outputs..."
          find app/build/intermediates/dex/release -name "*.dex" -exec cp {} "$DEX_OUT/" \; 2>/dev/null || true
          
          if [ ! -f "$DEX_OUT/classes.dex" ]; then
            find app/build/intermediates -name "classes*.dex" -exec cp {} "$DEX_OUT/" \; 2>/dev/null || true
          fi
          
          echo "==> Generated DEX files in $DEX_OUT:"
          ls -lh "$DEX_OUT"
          
          DEX_COUNT=$(find "$DEX_OUT" -type f -name "classes*.dex" | wc -l)
          echo "Total MultiDex DEX files generated: $DEX_COUNT"
          if [ "$DEX_COUNT" -eq 0 ]; then
            echo "ERROR: No DEX files were produced!" >&2
            exit 1
          fi

      - name: Upload MultiDex DEX Files Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multidex-dex-files
          path: output/dex/classes*.dex
          if-no-files-found: error
          retention-days: 7
