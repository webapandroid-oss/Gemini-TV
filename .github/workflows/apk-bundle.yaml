name: "Step 4: APK Packager, V2+V3 Signer & Release Publisher"

on:
  workflow_run:
    workflows: ["Step 3: Class to DEX MultiDex Converter"]
    types:
      - completed
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.1.0 or v2.1.0-build.1)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release Title'
        required: false
        default: ''
        type: string

concurrency:
  group: apk-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

env:
  STORE_PASSWORD: "android"
  KEY_PASSWORD: "android"
  KEY_ALIAS: "upload"

jobs:
  bundle_and_release_apk:
    name: Package APK, Sign (V2+V3) & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK Tools
        id: sdk_tools
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          
          ZIPALIGN_BIN=$(find "$SDK_DIR/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "$SDK_DIR/build-tools" -name apksigner | sort -V | tail -n 1)
          
          echo "ZIPALIGN_BIN=$ZIPALIGN_BIN" >> "$GITHUB_ENV"
          echo "APKSIGNER_BIN=$APKSIGNER_BIN" >> "$GITHUB_ENV"
          echo "Found zipalign at: $ZIPALIGN_BIN"
          echo "Found apksigner at: $APKSIGNER_BIN"

      - name: Prepare Environment Secrets Configuration
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Release Signing Keystore
        run: |
          ROOT_DIR="$(pwd)"
          KEYSTORE_FILE="$ROOT_DIR/my-upload-key.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Keystore not found, generating release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=GoogleGemini, OU=AndroidTV, O=Google, L=MountainView, S=CA, C=US"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Signing keystore ready at: $KEYSTORE_FILE"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build and Package Release APK with MultiDex, Resources & Native Libs
        run: |
          echo "==> Building official release APK using Android Gradle Plugin..."
          ./gradlew :app:assembleRelease --stacktrace

      - name: Align and Sign APK with v2 + v3 Scheme using my-upload-key.jks
        run: |
          DIST="workspace/dist"
          mkdir -p "$DIST"
          
          SRC_APK=$(find app/build/outputs/apk/release -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
            SRC_APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
            echo "ERROR: Release APK not found in build outputs!" >&2
            find app/build/outputs -type f || true
            exit 1
          fi
          
          echo "Found compiled release APK at: $SRC_APK"
          
          ALIGNED_APK="$DIST/app-aligned.apk"
          FINAL_APK="$DIST/gemini-tv-release.apk"
          
          echo "==> Verifying 4-byte page alignment with zipalign..."
          if "$ZIPALIGN_BIN" -c 4 "$SRC_APK"; then
            echo "APK is already aligned."
            cp "$SRC_APK" "$ALIGNED_APK"
          else
            echo "Aligning APK with 4-byte boundaries..."
            "$ZIPALIGN_BIN" -f -p 4 "$SRC_APK" "$ALIGNED_APK"
          fi
          
          echo "==> Signing APK with apksigner using my-upload-key.jks (v1, v2, v3 schemes)..."
          "$APKSIGNER_BIN" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"
            
          echo "==> Verifying signature details of the final APK..."
          "$APKSIGNER_BIN" verify --verbose --print-certs "$FINAL_APK"
          
          # Also stage universal naming APK
          cp "$FINAL_APK" "$DIST/2.1.0_google_gemini_native_universal.apk"
          
          echo "Staged APKs in $DIST:"
          ls -lh "$DIST"/*.apk

      - name: Upload Packaged APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tv-signed-release-apk
          path: workspace/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Determine Semantic Versioning & Unique Release Metadata
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Extract semantic version from AndroidManifest.xml and app/build.gradle.kts
          VERSION_NAME=$(grep -oP 'android:versionName="\K[^"]+' app/src/main/AndroidManifest.xml || echo "2.1.0")
          VERSION_CODE=$(grep -oP 'android:versionCode="\K[^"]+' app/src/main/AndroidManifest.xml || echo "5")
          
          echo "Detected Semantic Version: versionName=$VERSION_NAME, versionCode=$VERSION_CODE"
          
          # Resolve Release Tag
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            BASE_TAG="v${VERSION_NAME}"
            # Check if this release tag already exists on GitHub to prevent overwriting existing releases
            if gh release view "$BASE_TAG" >/dev/null 2>&1; then
              TAG="${BASE_TAG}-rev${{ github.run_number }}"
            else
              TAG="$BASE_TAG"
            fi
          fi
          
          # Resolve Release Title
          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TITLE="Google Gemini ${{ github.ref_name }} Universal Release"
          else
            TITLE="Google Gemini ${TAG} Universal Release (Build ${VERSION_CODE})"
          fi
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Final Target Tag: $TAG"
          echo "Final Target Title: $TITLE"

      - name: Publish Official GitHub Release
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Google Gemini Android TV Universal Release
            Production release built with Semantic Versioning, MultiDex, AAPT2 and signed with v2+v3 scheme.

            - **Version Name (SemVer):** `${{ steps.release_meta.outputs.version_name }}`
            - **Version Code:** `${{ steps.release_meta.outputs.version_code }}`
            - **Release Tag:** `${{ steps.release_meta.outputs.tag }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Workflow Run:** `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

            ### Included Release APKs:
            - `gemini-tv-release.apk` (Signed with v2+v3 scheme)
            - `2.1.0_google_gemini_native_universal.apk` (Universal package with native libraries)
          files: |
            workspace/dist/gemini-tv-release.apk
            workspace/dist/2.1.0_google_gemini_native_universal.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
