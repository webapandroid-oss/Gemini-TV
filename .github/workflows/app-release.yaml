name: Official Android Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Google Gemini TV Universal Release'
        type: string
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v2.0.1.1.0'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

env:
  STORE_PASSWORD: "android"
  KEY_PASSWORD: "android"
  KEY_ALIAS: "upload"

jobs:
  build_release:
    name: Build & Release Official Android APK (AGP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Environment
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using Android SDK at: $SDK_DIR"

      - name: Prepare Environment Secrets Configuration
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Release Signing Keystore
        run: |
          ROOT_DIR="$(pwd)"
          KEYSTORE_FILE="$ROOT_DIR/my-upload-key.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=GoogleGemini, OU=AndroidTV, O=Google, L=MountainView, S=CA, C=US"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Release keystore confirmed at: $KEYSTORE_FILE"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Official Release APK using Android Gradle Plugin (AGP)
        run: |
          echo "==> Building official release APK using root and app build.gradle.kts..."
          ./gradlew :app:assembleRelease --stacktrace

      - name: Stage Official Release APKs
        run: |
          DIST="workspace/dist"
          mkdir -p "$DIST"

          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC_APK" ]; then
            SRC_APK=$(find app/build/outputs/apk -name "*release*.apk" 2>/dev/null | head -n 1)
          fi

          if [ ! -f "$SRC_APK" ]; then
            echo "ERROR: Release APK not found in build outputs!" >&2
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "Found official AGP generated APK: $SRC_APK"
          cp "$SRC_APK" "$DIST/gemini-tv-release.apk"
          cp "$SRC_APK" "$DIST/2.0.1.1.0_google_gemini_20261031_5_native_gemini_lib_universal.apk"

          echo "Official release APKs staged in $DIST:"
          ls -lh "$DIST/"*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tv-release-apk
          path: workspace/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Auto-Publish Release via GitHub CLI
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_TITLE: ${{ inputs.release_title }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "==> Publishing Release to GitHub..."
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v2.0.1.1.0"
          fi

          if [ -n "$INPUT_TITLE" ]; then
            TITLE="$INPUT_TITLE"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TITLE="Google Gemini $GITHUB_REF_NAME Release"
          else
            TITLE="Google Gemini v2.0.1.1.0 Universal Release"
          fi

          RELEASE_APK="workspace/dist/gemini-tv-release.apk"
          NAMED_APK="workspace/dist/2.0.1.1.0_google_gemini_20261031_5_native_gemini_lib_universal.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading updated APK assets..."
            gh release upload "$TAG" "$RELEASE_APK" "$NAMED_APK" --clobber || echo "Warning: Upload to release completed."
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" "$RELEASE_APK" "$NAMED_APK" \
              --title "$TITLE" \
              --notes "Official Google Gemini Universal Release ($TAG) built with official Android Gradle Plugin (AGP)." \
              --latest || echo "Warning: Release creation logged."
          fi

          echo "GitHub Release step completed successfully!"
