name: AAPT Resource Compiler Tool

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_sdk:
        description: 'Target SDK for linking resources'
        required: false
        default: '35'
        type: string
  workflow_call:
    inputs:
      target_sdk:
        description: 'Target SDK for linking resources'
        required: false
        default: '35'
        type: string
    outputs:
      aapt_artifact_name:
        description: 'Name of the compiled AAPT resources artifact'
        value: ${{ jobs.compile_resources_aapt.outputs.aapt_artifact }}
      resources_path:
        description: 'Path to compiled resources.arsc and package'
        value: ${{ jobs.compile_resources_aapt.outputs.resources_dir }}

permissions:
  contents: read

jobs:
  compile_resources_aapt:
    name: Compile Android Resources and Manifest via AAPT2
    runs-on: ubuntu-latest
    outputs:
      aapt_artifact: aapt-resources-artifact
      resources_dir: output/aapt_out

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Environment & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # Pre-accept Android SDK licenses to prevent CI prompt failures
          mkdir -p "$SDK_DIR/licenses" 2>/dev/null || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || true
          echo -e "\n84831b9409646a2a8e44e4bed4aa6b9747fa4e54\n7c027e570dde35266876b72496147297e5c45324" > "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || true

          SDKMANAGER=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses 2>/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" 2>/dev/null || true
          fi

          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
            echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          fi
          echo "Android SDK ready at: $SDK_DIR"

      - name: Prepare CI Environment & Secrets
        run: |
          mkdir -p output/aapt_out output/flat_res

          # 1. Create .env if missing (gitignored in repo)
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Make gradlew executable
          chmod +x ./gradlew 2>/dev/null || true

          # 3. Restore debug.keystore if missing (gitignored in repo, required by debugConfig)
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
            fi
          fi

      - name: Compile and Link Resources using AAPT2 & Gradle
        run: |
          echo "==> Step 1: Running Gradle resource compilation tasks..."
          if [ -f "./gradlew" ]; then
            ./gradlew :app:processDebugResources :app:processDebugManifest --no-daemon --no-configuration-cache || true
          fi

          # Locate and extract compiled binary resources.arsc and binary AndroidManifest.xml from linked resources .ap_
          AP_FILE=$(find app/build/intermediates/linked_resources_binary_format -type f -name "*.ap_" 2>/dev/null | head -n 1)
          if [ -z "$AP_FILE" ]; then
            AP_FILE=$(find app/build/intermediates/processed_res -type f -name "*.ap_" 2>/dev/null | head -n 1)
          fi

          if [ -z "$AP_FILE" ]; then
            # Assemble debug to guarantee resources package exists
            if [ -f "./gradlew" ]; then
              ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache || true
            fi
            AP_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$AP_FILE" ] && [ -f "$AP_FILE" ]; then
            echo "Extracting resources.arsc and binary AndroidManifest.xml from $AP_FILE..."
            unzip -q -o "$AP_FILE" resources.arsc AndroidManifest.xml -d output/aapt_out/ 2>/dev/null || true
            cp "$AP_FILE" output/aapt_out/resources.apk 2>/dev/null || true
          fi

          # Copy web assets
          mkdir -p output/aapt_out/assets
          if [ -d "app/src/main/assets" ]; then
            cp -r app/src/main/assets/* output/aapt_out/assets/ 2>/dev/null || true
          fi

          echo "AAPT compiled artifacts summary:"
          ls -la output/aapt_out/

      - name: Upload AAPT Resources Artifact for Main Orchestrator
        uses: actions/upload-artifact@v4
        with:
          name: aapt-resources-artifact
          path: |
            output/aapt_out/resources.arsc
            output/aapt_out/AndroidManifest.xml
            output/aapt_out/resources.apk
            output/aapt_out/assets/**
          if-no-files-found: warn
          retention-days: 7
