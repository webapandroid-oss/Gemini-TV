name: AAPT Resource Compiler Tool

on:
  workflow_call:
    inputs:
      target_sdk:
        description: 'Target SDK for linking resources'
        required: false
        default: '35'
        type: string
    outputs:
      aapt_artifact_name:
        description: 'Name of the compiled AAPT resources artifact'
        value: ${{ jobs.compile_resources_aapt.outputs.aapt_artifact }}
      resources_path:
        description: 'Path to compiled resources.arsc and package'
        value: ${{ jobs.compile_resources_aapt.outputs.resources_dir }}
  workflow_dispatch:
    inputs:
      target_sdk:
        description: 'Target SDK for linking resources'
        required: false
        default: '35'

jobs:
  compile_resources_aapt:
    name: Compile Android Resources and Manifest via AAPT2
    runs-on: ubuntu-latest
    outputs:
      aapt_artifact: aapt-resources-artifact
      resources_dir: output/aapt_out

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK Environment
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi
          echo "Android SDK located at: $SDK_DIR"

      - name: Compile and Link Resources using AAPT2
        run: |
          echo "==> Step 1: Locating Android Build-Tools and SDK..."
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          ANDROID_JAR=$(find "$SDK_DIR/platforms" -name "android.jar" 2>/dev/null | sort -V | tail -n 1)
          echo "Using AAPT2 from: $AAPT2"
          echo "Using Android JAR: $ANDROID_JAR"

          mkdir -p output/aapt_out output/flat_res

          chmod +x ./gradlew 2>/dev/null || true
          if [ ! -f "./gradlew" ] && command -v gradle &>/dev/null; then
            gradle wrapper
          fi
          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            echo "Running Gradle resource and manifest processing tasks..."
            ./gradlew :app:processDebugResources :app:processDebugManifest --no-daemon || true
          fi

          # Extract compiled resources.arsc and compiled binary AndroidManifest.xml from linked resources .ap_
          AP_FILE=$(find app/build/intermediates/linked_resources_binary_format -type f -name "*.ap_" 2>/dev/null | head -n 1)
          if [ -z "$AP_FILE" ]; then
            AP_FILE=$(find app/build/intermediates/processed_res -type f -name "*.ap_" 2>/dev/null | head -n 1)
          fi
          if [ -z "$AP_FILE" ]; then
            # Assemble debug to guarantee linked resources exist
            ./gradlew :app:assembleDebug --no-daemon || true
            AP_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$AP_FILE" ] && [ -f "$AP_FILE" ]; then
            echo "Extracting resources.arsc and binary AndroidManifest.xml from $AP_FILE..."
            unzip -q -o "$AP_FILE" resources.arsc AndroidManifest.xml -d output/aapt_out/ 2>/dev/null || true
            cp "$AP_FILE" output/aapt_out/resources.apk 2>/dev/null || true
          fi

          # Copy web assets
          mkdir -p output/aapt_out/assets
          if [ -d "app/src/main/assets" ]; then
            cp -r app/src/main/assets/* output/aapt_out/assets/ 2>/dev/null || true
          fi

          echo "AAPT compiled artifacts summary:"
          ls -la output/aapt_out/

      - name: Upload AAPT Resources Artifact for Main Orchestrator
        uses: actions/upload-artifact@v4
        with:
          name: aapt-resources-artifact
          path: |
            output/aapt_out/resources.arsc
            output/aapt_out/AndroidManifest.xml
            output/aapt_out/resources.apk
            output/aapt_out/assets/**
          if-no-files-found: warn
          retention-days: 7
