name: "Step 3: Class to DEX MultiDex Converter"

on:
  workflow_run:
    workflows: ["Step 2: Kotlin to Class Converter"]
    types:
      - completed
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: class-to-dex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert_classes_to_dex:
    name: Convert .class Bytecode to MultiDex .dex Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Environment Secrets
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build MultiDex DEX Files via D8 and Gradle Engine
        run: |
          echo "==> Running MultiDex compilation engine for all Kotlin & Java classes..."
          # Run release dex builder and merge tasks with multidex support enabled
          ./gradlew :app:dexBuilderRelease :app:mergeDexRelease --stacktrace

      - name: Collect MultiDex DEX Outputs
        run: |
          DEX_OUT="output/dex"
          mkdir -p "$DEX_OUT"
          
          echo "==> Gathering generated DEX files from intermediate build outputs..."
          # Locate all dex files generated by mergeDexRelease or dexBuilder
          find app/build/intermediates/dex/release -name "*.dex" -exec cp {} "$DEX_OUT/" \; 2>/dev/null || true
          
          # If mergeDex outputs in subdirectories, also search app/build/intermediates
          if [ ! -f "$DEX_OUT/classes.dex" ]; then
            find app/build/intermediates -name "classes*.dex" -exec cp {} "$DEX_OUT/" \; 2>/dev/null || true
          fi
          
          echo "==> MultiDex conversion complete. Generated DEX files in $DEX_OUT:"
          ls -lh "$DEX_OUT"
          
          DEX_COUNT=$(find "$DEX_OUT" -type f -name "classes*.dex" | wc -l)
          echo "Total MultiDex DEX files generated: $DEX_COUNT"
          if [ "$DEX_COUNT" -eq 0 ]; then
            echo "ERROR: No DEX files were produced!" >&2
            exit 1
          fi

      - name: Upload MultiDex DEX Files Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multidex-files-artifact
          path: output/dex/classes*.dex
          if-no-files-found: error
          retention-days: 7
