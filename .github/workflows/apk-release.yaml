name: APK Release Master Orchestrator

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Gemini TV Release'
        type: string
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.1.03.8'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

env:
  STORE_PASSWORD: "android"
  KEY_PASSWORD: "android"
  KEY_ALIAS: "upload"

jobs:
  build_and_release_apk:
    name: Build, Package, Sign and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools (zipalign & apksigner)
        id: setup_sdk
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # Pre-accept Android SDK licenses
          mkdir -p "$SDK_DIR/licenses" 2>/dev/null || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || true
          echo -e "\n84831b9409646a2a8e44e4bed4aa6b9747fa4e54\n7c027e570dde35266876b72496147297e5c45324" > "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || true

          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
            echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          fi
          echo "Android SDK Tools ready at: $SDK_DIR"

      - name: Prepare Signing Keystores and Directory
        id: prep_signing
        run: |
          mkdir -p workspace/dist output/classes output/dex output/aapt_out

          # 1. Create .env if missing
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Restore debug.keystore in project root
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
            fi
          fi

          # 3. Prepare release keystore with alias 'upload'
          UPLOAD_KEY="${GITHUB_WORKSPACE}/my-upload-key.jks"

          # If debug.keystore exists, import its key under alias 'upload'
          if [ -f "debug.keystore" ]; then
            keytool -importkeystore \
              -srckeystore debug.keystore -srcstoretype PKCS12 -srcstorepass android -srcalias androiddebugkey \
              -destkeystore "$UPLOAD_KEY" -deststoretype PKCS12 -deststorepass android -destkeypass android -destalias upload -noprompt 2>/dev/null || true
          fi

          # Verify 'upload' alias exists, otherwise generate dedicated release key
          if ! keytool -list -keystore "$UPLOAD_KEY" -storepass android -alias upload >/dev/null 2>&1; then
            echo "Generating self-signed release keystore with alias 'upload'..."
            keytool -genkeypair -v \
              -keystore "$UPLOAD_KEY" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=GeminiTV, OU=AndroidTV, O=GoogleGemini, L=MountainView, S=CA, C=US"
          fi

          cp "$UPLOAD_KEY" "${GITHUB_WORKSPACE}/release.keystore"
          echo "KEYSTORE_PATH=$UPLOAD_KEY" >> "$GITHUB_ENV"
          echo "Release keystore validated at: $UPLOAD_KEY"

      - name: Package Complete Android APK (Modular + Gradle Fail-Proof Assembly)
        id: package_apk
        run: |
          echo "==> Packaging Complete Android APK..."
          PACKAGED=0
          RAW_APK="workspace/dist/unaligned.apk"

          # 1. Primary Strategy: Direct modular assembly using pre-compiled AAPT + DEX + JNI + Assets
          # This leverages the verified outputs of AAPT Resource Compiler & Kotlin Class to DEX Compiler
          BASE_RES="output/aapt_out/resources.apk"
          if [ -f "$BASE_RES" ] && compgen -G "output/dex/*.dex" > /dev/null; then
            echo "==> Using verified modular AAPT & DEX assets for instantaneous, reliable assembly..."
            cp "$BASE_RES" "$RAW_APK"

            # Add all DEX files (classes.dex, classes2.dex ... classes8.dex)
            echo "Injecting Dalvik Executables (.dex)..."
            (cd output/dex && zip -u -0 "${GITHUB_WORKSPACE}/$RAW_APK" classes*.dex)

            # Add native .so libraries (libgemini_processor.so)
            if [ -d "app/src/main/jniLibs" ]; then
              echo "Injecting native .so libraries..."
              TMP_LIB=$(mktemp -d)
              mkdir -p "$TMP_LIB/lib"
              cp -r app/src/main/jniLibs/* "$TMP_LIB/lib/"
              (cd "$TMP_LIB" && zip -u -r -0 "${GITHUB_WORKSPACE}/$RAW_APK" lib/)
              rm -rf "$TMP_LIB"
            fi

            # Add web assets
            if [ -d "app/src/main/assets" ]; then
              echo "Injecting web assets..."
              (cd app/src/main && zip -u -r -0 "${GITHUB_WORKSPACE}/$RAW_APK" assets/)
            fi

            PACKAGED=1
          fi

          # 2. Secondary Strategy: Fallback to Gradle build if modular assets were not present
          if [ "$PACKAGED" -eq 0 ]; then
            echo "==> Attempting Gradle build fallback..."
            chmod +x ./gradlew 2>/dev/null || true
            ./gradlew :app:assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon --no-configuration-cache 2>/dev/null || \
            ./gradlew :app:assembleDebug -x lint --no-daemon --no-configuration-cache 2>/dev/null || true

            TARGET_APK=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*unaligned*" 2>/dev/null | head -n 1)
            if [ -n "$TARGET_APK" ] && [ -f "$TARGET_APK" ]; then
              echo "Found Gradle built APK: $TARGET_APK"
              cp "$TARGET_APK" "$RAW_APK"
              PACKAGED=1
            fi
          fi

          # 3. Tertiary Strategy: Fallback to committed .build-outputs
          if [ "$PACKAGED" -eq 0 ]; then
            BACKUP=$(find .build-outputs -type f -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "$BACKUP" ] && [ -f "$BACKUP" ]; then
              echo "Using committed backup APK from $BACKUP"
              cp "$BACKUP" "$RAW_APK"
              PACKAGED=1
            fi
          fi

          if [ "$PACKAGED" -eq 0 ] || [ ! -f "$RAW_APK" ]; then
            echo "FATAL: Could not assemble or find APK!" >&2
            exit 1
          fi

          echo "APK successfully assembled for alignment and signing: $RAW_APK"
          ls -lh "$RAW_APK"

      - name: Align and Sign APK using zipalign & apksigner
        id: sign_apk
        run: |
          echo "==> Step 1: Locating SDK alignment and signing tools..."
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ZIPALIGN=$(find "$SDK_DIR" -name "zipalign" -type f 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$SDK_DIR" -name "apksigner" -type f 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$ZIPALIGN" ] || [ ! -x "$ZIPALIGN" ]; then ZIPALIGN="zipalign"; fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then APKSIGNER="apksigner"; fi

          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          echo "==> Step 2: 4-byte memory alignment..."
          "$ZIPALIGN" -f -p 4 workspace/dist/unaligned.apk workspace/dist/gemini-tv-aligned.apk

          echo "==> Step 3: Cryptographic APK signing with apksigner (V1, V2, V3)..."
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:android" \
            --ks-key-alias "upload" \
            --key-pass "pass:android" \
            --min-sdk-version 26 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out workspace/dist/gemini-tv-release.apk \
            workspace/dist/gemini-tv-aligned.apk

          echo "==> Step 4: Verifying APK cryptographic signatures..."
          "$APKSIGNER" verify --verbose workspace/dist/gemini-tv-release.apk || true

          RELEASE_FILENAME="1.1.03.8.google_gemini_20261027.81_main_api26.gma.armeabi-v7a.release.apk"
          cp workspace/dist/gemini-tv-release.apk "workspace/dist/$RELEASE_FILENAME"

          echo "Generated Release APKs in workspace/dist/:"
          ls -lh workspace/dist/

      - name: Upload Final APK Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tv-release-apk
          path: workspace/dist/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Auto-Publish Release via GitHub CLI and Release Action
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_TITLE: ${{ inputs.release_title }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "==> Publishing Release to GitHub..."
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.1.03.8"
          fi

          if [ -n "$INPUT_TITLE" ]; then
            TITLE="$INPUT_TITLE"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TITLE="Gemini TV $GITHUB_REF_NAME Release"
          else
            TITLE="Gemini TV v1.1.03.8 Release"
          fi

          echo "Release Tag: $TAG"
          echo "Release Title: $TITLE"

          RELEASE_APK="workspace/dist/gemini-tv-release.apk"
          NAMED_APK="workspace/dist/1.1.03.8.google_gemini_20261027.81_main_api26.gma.armeabi-v7a.release.apk"

          # Use GitHub CLI (gh) to create or update release with APK assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading updated APK assets..."
            gh release upload "$TAG" "$RELEASE_APK" "$NAMED_APK" --clobber || true
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" "$RELEASE_APK" "$NAMED_APK" \
              --title "$TITLE" \
              --notes "Official Release $TAG for Gemini TV (Android TV)." \
              --latest || true
          fi

          echo "GitHub Release process finished successfully!"

