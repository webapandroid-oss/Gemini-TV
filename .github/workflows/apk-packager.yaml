name: "Release Android TV APK Packager & Publisher"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v3.0.0 or v3.0.0-build.1)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release Title'
        required: false
        default: ''
        type: string
      tv_variant:
        description: 'Android TV Variant (all, 64bit, 32bit)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '64bit'
          - '32bit'

concurrency:
  group: apk-packager-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

env:
  STORE_PASSWORD: "android"
  KEY_PASSWORD: "android"
  KEY_ALIAS: "upload"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Djava.awt.headless=true -XX:MaxMetaspaceSize=512m"

jobs:
  bundle_and_release_apk:
    name: Package 64-bit & 32-bit Android TV APKs, Sign (V2+V3) & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK Environment
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

          ZIPALIGN_BIN=$(find "$SDK_DIR/build-tools" -name zipalign 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "$SDK_DIR/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)

          echo "ZIPALIGN_BIN=$ZIPALIGN_BIN" >> "$GITHUB_ENV"
          echo "APKSIGNER_BIN=$APKSIGNER_BIN" >> "$GITHUB_ENV"
          echo "Found zipalign at: $ZIPALIGN_BIN"
          echo "Found apksigner at: $APKSIGNER_BIN"

      - name: Prepare Environment Secrets Configuration
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Release Signing Keystore
        run: |
          ROOT_DIR="$(pwd)"
          KEYSTORE_FILE="$ROOT_DIR/my-upload-key.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=GoogleGemini, OU=AndroidTV, O=Google, L=MountainView, S=CA, C=US"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Keystore ready at: $KEYSTORE_FILE"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Semantic Versioning & Unique Release Metadata
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "3.0.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts || echo "6")

          echo "Detected SemVer: versionName=$VERSION_NAME, versionCode=$VERSION_CODE"

          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            BASE_TAG="v${VERSION_NAME}"
            if gh release view "$BASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              TAG="${BASE_TAG}-build.${{ github.run_number }}"
            else
              TAG="$BASE_TAG"
            fi
          fi

          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TITLE="Google Gemini Android TV ${{ github.ref_name }} Release"
          else
            TITLE="Google Gemini Android TV ${TAG} Release (Build ${VERSION_CODE})"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build, Align & Sign Android TV APK Variants (64-bit & 32-bit)
        run: |
          DIST="workspace/dist"
          mkdir -p "$DIST"
          VERSION_NAME="${{ steps.release_meta.outputs.version_name }}"
          VARIANT="${{ inputs.tv_variant || 'all' }}"

          build_and_package_abi() {
            local ABI="$1"
            local LABEL="$2"
            local OUT_NAME="$3"

            echo "==> Building $LABEL ($ABI) Android TV Release APK..."
            rm -rf app/build/outputs/apk/release
            ./gradlew :app:assembleRelease -PabiFilter="$ABI" --stacktrace --no-daemon

            local SRC_APK
            SRC_APK=$(find app/build/outputs/apk/release -name "*release*.apk" 2>/dev/null | head -n 1)
            if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
              SRC_APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
            fi

            if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
              echo "ERROR: $LABEL Release APK not found!" >&2
              exit 1
            fi

            local ALIGNED_APK="$DIST/tmp-${ABI}-aligned.apk"
            local FINAL_APK="$DIST/${OUT_NAME}"

            if [ -n "$ZIPALIGN_BIN" ] && [ -x "$ZIPALIGN_BIN" ]; then
              if "$ZIPALIGN_BIN" -c 4 "$SRC_APK"; then
                cp "$SRC_APK" "$ALIGNED_APK"
              else
                "$ZIPALIGN_BIN" -f -p 4 "$SRC_APK" "$ALIGNED_APK"
              fi
            else
              cp "$SRC_APK" "$ALIGNED_APK"
            fi

            if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
              "$APKSIGNER_BIN" sign \
                --ks "$KEYSTORE_PATH" \
                --ks-pass "pass:$STORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASSWORD" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --out "$FINAL_APK" \
                "$ALIGNED_APK"
              "$APKSIGNER_BIN" verify --verbose --print-certs "$FINAL_APK" || true
            else
              cp "$ALIGNED_APK" "$FINAL_APK"
            fi

            rm -f "$ALIGNED_APK"
            echo "==> Packaged $LABEL APK: $FINAL_APK"
          }

          if [ "$VARIANT" = "all" ] || [ "$VARIANT" = "64bit" ]; then
            build_and_package_abi "arm64-v8a" "64-bit Android TV" "gemini-tv-${VERSION_NAME}-android-tv-64bit-arm64-v8a.apk"
          fi

          if [ "$VARIANT" = "all" ] || [ "$VARIANT" = "32bit" ]; then
            build_and_package_abi "armeabi-v7a" "32-bit Android TV" "gemini-tv-${VERSION_NAME}-android-tv-32bit-armeabi-v7a.apk"
          fi

          echo "==> Final Release APKs in $DIST:"
          ls -lh "$DIST"/*.apk

      - name: Upload Packaged Android TV APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tv-android-tv-release-apks
          path: workspace/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Official GitHub Release
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Google Gemini Android TV Release — v${{ steps.release_meta.outputs.version_name }}
            Dedicated Android TV production release with Leanback launcher support, full D-pad remote navigation, and signed 64-bit & 32-bit APK variants.

            ### 📺 What's New in v${{ steps.release_meta.outputs.version_name }}
            - **Dedicated Android TV Manifest:** Configured `android.software.leanback` (`required="true"`), `android.hardware.type.television` (`required="true"`), `android.hardware.touchscreen` (`required="false"`), and `LEANBACK_LAUNCHER`.
            - **Full D-Pad Remote Navigation:** Optimized every screen, button, suggestion card, message bubble, text input field, and dialog for effortless Up / Down / Left / Right / OK / Back TV remote control with high-contrast focus highlights.
            - **Direct Gemini 3.8 & 3.8 Pro Integration:** Native support for `gemini-3.8-flash` and `gemini-3.8-pro` with live top-bar model switching and up to 8,192 output tokens.
            - **Dual Android TV Variants:** Separate signed v1+v2+v3 release APKs for **64-bit (`arm64-v8a`)** and **32-bit (`armeabi-v7a`)** Android TV devices.

            ### 📦 Build Metadata
            - **Version Name (SemVer):** `${{ steps.release_meta.outputs.version_name }}`
            - **Version Code:** `${{ steps.release_meta.outputs.version_code }}`
            - **Release Tag:** `${{ steps.release_meta.outputs.tag }}`
            - **Commit SHA:** `${{ github.sha }}`

            ### Included Android TV Release APKs:
            - `gemini-tv-${{ steps.release_meta.outputs.version_name }}-android-tv-64bit-arm64-v8a.apk` (64-bit Android TV variant)
            - `gemini-tv-${{ steps.release_meta.outputs.version_name }}-android-tv-32bit-armeabi-v7a.apk` (32-bit Android TV variant)
          files: |
            workspace/dist/*.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
