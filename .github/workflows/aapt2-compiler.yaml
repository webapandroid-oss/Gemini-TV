name: "Step 1: AAPT2 Resource Compiler & Linker"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: aapt2-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile_resources:
    name: Compile & Link Android Resources (AAPT2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK & AAPT2 Tools
        id: sdk_tools
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          
          AAPT2_BIN=$(find "$SDK_DIR/build-tools" -name aapt2 | sort -V | tail -n 1)
          ANDROID_JAR=$(find "$SDK_DIR/platforms" -name android.jar | sort -V | tail -n 1)
          
          if [ -z "$AAPT2_BIN" ] || [ ! -f "$AAPT2_BIN" ]; then
            echo "ERROR: AAPT2 binary not found in $SDK_DIR/build-tools" >&2
            exit 1
          fi
          if [ -z "$ANDROID_JAR" ] || [ ! -f "$ANDROID_JAR" ]; then
            echo "ERROR: android.jar not found in $SDK_DIR/platforms" >&2
            exit 1
          fi
          
          echo "AAPT2_BIN=$AAPT2_BIN" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_JAR" >> "$GITHUB_ENV"
          echo "Found AAPT2 at: $AAPT2_BIN"
          echo "Found android.jar at: $ANDROID_JAR"

      - name: Compile Resources with AAPT2
        run: |
          OUTPUT_DIR="output/aapt_out"
          mkdir -p "$OUTPUT_DIR"
          
          echo "==> Compiling resources from app/src/main/res..."
          "$AAPT2_BIN" compile --dir app/src/main/res -o "$OUTPUT_DIR/compiled_resources.zip"
          
          echo "==> Linking compiled resources against AndroidManifest.xml and android.jar..."
          "$AAPT2_BIN" link \
            -I "$ANDROID_JAR" \
            --manifest app/src/main/AndroidManifest.xml \
            --auto-add-overlay \
            -o "$OUTPUT_DIR/resources.apk" \
            --java "$OUTPUT_DIR/gen" \
            "$OUTPUT_DIR/compiled_resources.zip"
            
          # Extract compiled binary AndroidManifest.xml and resources.arsc for inspection
          echo "==> Extracting compiled binary AndroidManifest.xml and resources.arsc..."
          unzip -qo "$OUTPUT_DIR/resources.apk" AndroidManifest.xml resources.arsc -d "$OUTPUT_DIR" || true
          cp "$OUTPUT_DIR/resources.apk" "$OUTPUT_DIR/resources.ap_" || true

      - name: Verify Compiled Resource Outputs
        run: |
          OUTPUT_DIR="output/aapt_out"
          echo "==> Compiled resource files in $OUTPUT_DIR:"
          ls -lh "$OUTPUT_DIR"
          if [ ! -f "$OUTPUT_DIR/resources.apk" ]; then
            echo "ERROR: resources.apk was not generated!" >&2
            exit 1
          fi

      - name: Upload AAPT2 Compiled Resources Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-compiled-resources
          path: |
            output/aapt_out/resources.apk
            output/aapt_out/resources.ap_
            output/aapt_out/resources.arsc
            output/aapt_out/AndroidManifest.xml
            output/aapt_out/gen
          if-no-files-found: error
          retention-days: 7
