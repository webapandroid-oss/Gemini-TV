name: Kotlin Class to DEX Compiler

on:
  workflow_call:
    inputs:
      min_sdk:
        description: 'Target minimum SDK level for dexer'
        required: false
        default: '26'
        type: string
    outputs:
      dex_artifact_name:
        description: 'Name of the uploaded DEX artifact'
        value: ${{ jobs.compile_kotlin_to_dex.outputs.dex_artifact }}
      dex_file_path:
        description: 'Relative path to generated classes.dex'
        value: ${{ jobs.compile_kotlin_to_dex.outputs.dex_path }}
  workflow_dispatch:
    inputs:
      min_sdk:
        description: 'Target minimum SDK level for dexer'
        required: false
        default: '26'

jobs:
  compile_kotlin_to_dex:
    name: Compile Kotlin to JVM Class and DEX
    runs-on: ubuntu-latest
    outputs:
      dex_artifact: classes-dex-artifact
      dex_path: output/classes.dex

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools & Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile Kotlin and Java Sources to .class Bytecode
        run: |
          echo "==> Step 1: Compiling Kotlin code into Java .class bytecode..."
          mkdir -p output/classes
          
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon
            find app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes -type f -name "*.class" -exec cp --parents {} output/classes/ \; 2>/dev/null || true
            find app/build/tmp/kotlin-classes/debug -type f -name "*.class" -exec cp --parents {} output/classes/ \; 2>/dev/null || true
          fi

          echo "Compiled .class files generated:"
          find app/build -type f -name "*.class" | head -n 30 || true

      - name: Convert .class Bytecode to Android .dex with D8 / DX
        run: |
          echo "==> Step 2: Converting compiled .class files into Dalvik Executable (.dex)..."
          mkdir -p output/dex
          
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build-Tools at: $BUILD_TOOLS_DIR"
          
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:dexDebug --no-daemon 2>/dev/null || ./gradlew :app:assembleDebug --no-daemon
            DEX_FOUND=$(find app/build -type f -name "classes.dex" | head -n 1)
            if [ -n "$DEX_FOUND" ] && [ -f "$DEX_FOUND" ]; then
              cp "$DEX_FOUND" output/dex/classes.dex
              echo "Successfully captured classes.dex from: $DEX_FOUND"
            fi
          fi

          if [ ! -f "output/dex/classes.dex" ]; then
            ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
            echo "Running D8 directly with android.jar..."
            find app/build -type f -name "*.class" > class_list.txt
            if [ -s class_list.txt ]; then
              "$BUILD_TOOLS_DIR/d8" --release --min-api ${{ inputs.min_sdk || '26' }} --lib "$ANDROID_JAR" --output output/dex/ $(cat class_list.txt)
            fi
          fi

          echo "Final DEX verification:"
          ls -lh output/dex/

      - name: Upload classes.dex Artifact for Main Orchestrator
        uses: actions/upload-artifact@v4
        with:
          name: classes-dex-artifact
          path: |
            output/dex/classes.dex
            app/build/intermediates/dex/debug/**/*.dex
          if-no-files-found: warn
          retention-days: 7
